<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

const PHI = 1.6180339887, IP = 1/PHI, TAU = Math.PI*2;
const mob = /Android|iPhone|iPad|iPod|webOS/i.test(navigator.userAgent);
const clk = new THREE.Clock();
let R, cam, comp, on = false, loc = 0, trn = false, trP = 0, trF = 0, trT = 0, bp = 0;
let mpos = {x:0, y:0};
const scenes = [null,null,null];
const data = [{},{},{}];
let tScene, tPts;
let mapOpen = false;
let lastTime = 0;

function $(id){ return document.getElementById(id) }
function breath(t){ const c=25,r=(t%c)/c; return r<.28 ? r/.28 : r<.72 ? 1 : 1-(r-.72)/.28 }

// ═══ INIT ═══
async function init(){
  try {
    R = new THREE.WebGLRenderer({antialias:!mob, powerPreference:'high-performance'});
    R.setSize(innerWidth, innerHeight);
    R.setPixelRatio(Math.min(devicePixelRatio, mob?1.5:2));
    R.toneMapping = THREE.ACESFilmicToneMapping;
    R.toneMappingExposure = 1;
    R.outputColorSpace = THREE.SRGBColorSpace;
    document.body.insertBefore(R.domElement, document.body.firstChild);

    cam = new THREE.PerspectiveCamera(65, innerWidth/innerHeight, 0.1, 2000);

    const dummyScene = new THREE.Scene();
    comp = new EffectComposer(R);
    comp.addPass(new RenderPass(dummyScene, cam));
    comp.addPass(new UnrealBloomPass(
      new THREE.Vector2(innerWidth, innerHeight),
      mob ? 0.7 : 1.1, 0.5, 0.25
    ));

    buildEmergence();
    buildLake();
    buildLattice();
    buildTransition();

    window.addEventListener('resize', () => {
      cam.aspect = innerWidth/innerHeight;
      cam.updateProjectionMatrix();
      R.setSize(innerWidth, innerHeight);
      comp.setSize(innerWidth, innerHeight);
    });
    window.addEventListener('mousemove', e => {
      mpos.x = (e.clientX/innerWidth)*2-1;
      mpos.y = -(e.clientY/innerHeight)*2+1;
    });
    window.addEventListener('click', onWorldClick);
    window.addEventListener('touchstart', onWorldTouch, {passive:true});
    setupNav();

    $('M').addEventListener('click', toggleMap);
    $('CX').addEventListener('click', toggleMap);
    $('MC').addEventListener('click', onMapClick);

    $('SP').style.display = 'none';
    $('B').style.display = 'block';
    $('B').addEventListener('click', enter);

    animate();
  } catch(e) {
    console.error('Init error:', e);
    document.title = 'ERROR: ' + e.message;
  }
}

function enter(){
  on = true;
  $('E').classList.add('h');
  setTimeout(() => $('E').style.display='none', 3000);
  $('M').style.display = 'flex';
  showLoc();
  showHint();
  startAudio();
  startTexts();
}

let audio;
function startAudio(){
  try {
    audio = new Audio('lumens-world-ambient.mp3');
    audio.loop = true;
    audio.volume = 0;
    audio.play().then(() => {
      let step = 0;
      const fade = setInterval(() => {
        step++;
        audio.volume = Math.min(step * 0.008, 0.3);
        if(step >= 40) clearInterval(fade);
      }, 100);
    }).catch(() => {});
  } catch(e){}
}

// ═══ LOCATION 1: THE EMERGENCE ═══
function buildEmergence(){
  const sc = new THREE.Scene();
  sc.fog = new THREE.FogExp2(0x040818, 0.004);
  scenes[0] = sc;
  const d = data[0];

  sc.add(new THREE.AmbientLight(0x0a1628, 0.5));
  const sun = new THREE.DirectionalLight(0xffeedd, 0.6);
  sun.position.set(10, 60, -50);
  sc.add(sun);

  const lc = [0x44ffaa, 0x88aaff, 0xffcc44, 0x44ffcc, 0xff88cc, 0xaaeeff, 0x66ff88, 0xffaa66];
  for(let i=0; i<8; i++){
    const pl = new THREE.PointLight(lc[i], 2, 50);
    pl.position.set(Math.sin(i*PHI*2)*12, 5+Math.random()*12, -i*50-20);
    sc.add(pl);
  }

  // Sky dome
  const skyMat = new THREE.ShaderMaterial({
    side: THREE.BackSide, depthWrite: false,
    uniforms: { uT: {value:0} },
    vertexShader: `varying vec3 vP; void main(){ vP=normalize(position); gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.); }`,
    fragmentShader: `uniform float uT; varying vec3 vP; void main(){
      float y=vP.y; vec3 c=mix(vec3(.02,.04,.08),vec3(.01,.03,.06),smoothstep(0.,.3,y));
      c=mix(c,vec3(.005,.015,.04),smoothstep(.3,.8,y));
      float s=pow(max(sin(vP.x*200.+uT*.02)*sin(vP.z*200.+uT*.015),0.),12.);
      c+=vec3(.6,.6,.8)*s*smoothstep(.15,.5,y)*.4;
      gl_FragColor=vec4(c,1.); }`
  });
  sc.add(new THREE.Mesh(new THREE.SphereGeometry(800,32,32), skyMat));

  // Ground
  const gndMat = new THREE.ShaderMaterial({
    uniforms: { uT: {value:0} },
    vertexShader: `varying vec3 vW; void main(){ vW=(modelMatrix*vec4(position,1.)).xyz; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.); }`,
    fragmentShader: `uniform float uT; varying vec3 vW; void main(){
      vec3 c=vec3(.01,.03,.02);
      float g=sin(vW.x*.5+uT*.1)*sin(vW.z*.3+uT*.08);
      c+=vec3(0.,.08,.04)*max(g,0.)*.5;
      float f=pow(max(sin(vW.x*2.+vW.z*1.5)*sin(vW.z*3.-vW.x*.5),0.),8.);
      c+=vec3(.3,.1,.2)*f*.4;
      gl_FragColor=vec4(c,1.); }`
  });
  const gnd = new THREE.Mesh(new THREE.PlaneGeometry(80,500,40,200), gndMat);
  gnd.rotation.x = -Math.PI/2;
  gnd.position.set(0, -1, -200);
  sc.add(gnd);

  // Crystal trees
  const tm = new THREE.MeshStandardMaterial({color:0x115533, emissive:0x042211, roughness:.4, metalness:.3});
  const cms = [
    new THREE.MeshStandardMaterial({color:0x44ffaa, emissive:0x11aa55, transparent:true, opacity:.7, roughness:.1, metalness:.6}),
    new THREE.MeshStandardMaterial({color:0x88ccff, emissive:0x3366aa, transparent:true, opacity:.65, roughness:.1, metalness:.6}),
    new THREE.MeshStandardMaterial({color:0xffcc44, emissive:0xaa7711, transparent:true, opacity:.7, roughness:.1, metalness:.5})
  ];

  for(let i=0; i<50; i++){
    const side = i%2 ? -1 : 1;
    const x = side * (4 + Math.random()*16 + Math.sin(i*PHI)*3);
    const z = -i*8 - Math.random()*5;
    const h = 8 + Math.random()*15;
    const g = new THREE.Group();
    g.position.set(x, -1, z);

    const trunk = new THREE.Mesh(new THREE.CylinderGeometry(.12,.25,h,5), tm);
    trunk.position.y = h/2;
    g.add(trunk);

    addBranch(g, 0, h*.55, 0, h*.22, Math.PI*.35, 0, 3, cms[i%3]);
    addBranch(g, 0, h*.7, 0, h*.18, Math.PI*.3, Math.PI, 3, cms[(i+1)%3]);
    addBranch(g, 0, h*.85, 0, h*.12, Math.PI*.25, Math.PI*.5, 2, cms[(i+2)%3]);
    sc.add(g);
  }

  // Particles
  const pn = mob ? 1500 : 3000;
  const pg = new THREE.BufferGeometry();
  const pp = new Float32Array(pn*3), pph = new Float32Array(pn), psz = new Float32Array(pn);
  for(let i=0; i<pn; i++){
    pp[i*3] = (Math.random()-.5)*50;
    pp[i*3+1] = Math.random()*30;
    pp[i*3+2] = -Math.random()*400;
    pph[i] = Math.random()*TAU;
    psz[i] = .5 + Math.random()*2;
  }
  pg.setAttribute('position', new THREE.BufferAttribute(pp,3));
  pg.setAttribute('aP', new THREE.BufferAttribute(pph,1));
  pg.setAttribute('aS', new THREE.BufferAttribute(psz,1));

  d.pts = new THREE.Points(pg, new THREE.ShaderMaterial({
    uniforms: { uT:{value:0}, uB:{value:0} },
    vertexShader: `attribute float aP; attribute float aS; uniform float uT; uniform float uB;
      varying float vA; varying vec3 vC;
      void main(){
        vec3 p=position; p.y-=uT*(2.+sin(aP)); p.y=mod(p.y,30.);
        p.x+=sin(uT*.5+aP)*.5;
        float tw=sin(uT*2.+aP*5.)*.3+.7; vA=tw*(.5+uB*.3);
        float h=fract(aP*.159);
        vC=mix(vec3(1.,.85,.3),mix(vec3(.3,1.,.5),vec3(.9,.95,1.),h),h);
        vec4 mv=modelViewMatrix*vec4(p,1.);
        gl_PointSize=aS*tw*(150./-mv.z);
        gl_Position=projectionMatrix*mv; }`,
    fragmentShader: `varying float vA; varying vec3 vC;
      void main(){ float d=length(gl_PointCoord-.5)*2.; gl_FragColor=vec4(vC*1.3,exp(-d*d*4.)*vA); }`,
    transparent:true, depthWrite:false, blending:THREE.AdditiveBlending
  }));
  sc.add(d.pts);

  // Flowers
  const fn = mob ? 200 : 500;
  const fg = new THREE.BufferGeometry();
  const fp = new Float32Array(fn*3), fph = new Float32Array(fn);
  for(let i=0; i<fn; i++){
    fp[i*3] = (Math.random()-.5)*50;
    fp[i*3+1] = -.5 + Math.random()*.8;
    fp[i*3+2] = -Math.random()*400;
    fph[i] = Math.random()*TAU;
  }
  fg.setAttribute('position', new THREE.BufferAttribute(fp,3));
  fg.setAttribute('aP', new THREE.BufferAttribute(fph,1));
  sc.add(new THREE.Points(fg, new THREE.ShaderMaterial({
    uniforms: { uT:{value:0} },
    vertexShader: `attribute float aP; uniform float uT; varying float vA; varying vec3 vC;
      void main(){ float b=sin(uT*.5+aP*3.)*.5+.5; vA=b*.8;
        vC=mix(vec3(1.,.3,.5),vec3(.8,.2,.9),fract(aP));
        vec4 mv=modelViewMatrix*vec4(position,1.);
        gl_PointSize=(2.+b*3.)*(100./-mv.z); gl_Position=projectionMatrix*mv; }`,
    fragmentShader: `varying float vA; varying vec3 vC;
      void main(){ float d=length(gl_PointCoord-.5)*2.; gl_FragColor=vec4(vC,exp(-d*d*3.)*vA); }`,
    transparent:true, depthWrite:false, blending:THREE.AdditiveBlending
  })));

  d.cz = 0;
}

function addBranch(parent, x, y, z, len, pitch, yaw, depth, mat){
  if(depth <= 0 || len < 0.4) return;
  const ex = x + Math.sin(pitch)*Math.cos(yaw)*len;
  const ey = y + Math.cos(pitch)*len;
  const ez = z + Math.sin(pitch)*Math.sin(yaw)*len;

  const cyl = new THREE.Mesh(new THREE.CylinderGeometry(.04*depth, .08*depth, len, 4), mat);
  cyl.position.set((x+ex)/2, (y+ey)/2, (z+ez)/2);
  cyl.lookAt(new THREE.Vector3(ex, ey, ez));
  cyl.rotateX(Math.PI/2);
  parent.add(cyl);

  if(depth <= 2){
    const tip = new THREE.Mesh(new THREE.OctahedronGeometry(.15*depth, 0), mat);
    tip.position.set(ex, ey, ez);
    parent.add(tip);
  }

  const nl = len * IP;
  addBranch(parent, ex, ey, ez, nl, pitch-.6*IP, yaw+PHI, depth-1, mat);
  addBranch(parent, ex, ey, ez, nl*IP, pitch+.6, yaw-IP, depth-1, mat);
}

function updateEmergence(t, dt){
  const d = data[0];
  d.cz -= dt * (10 + Math.sin(t*.4)*3);
  if(d.cz < -380) d.cz = 0;

  const sx = Math.sin(t*.4)*1.5 + mpos.x*4;
  const sy = 5 + Math.sin(t*.25) + mpos.y*2;
  cam.position.set(sx, sy, d.cz);
  cam.lookAt(sx*.2, sy*.7, d.cz - 25);

  scenes[0].traverse(o => {
    if(o.material && o.material.uniforms){
      if(o.material.uniforms.uT) o.material.uniforms.uT.value = t;
      if(o.material.uniforms.uB) o.material.uniforms.uB.value = bp;
    }
  });
}

// ═══ LOCATION 2: THE LAKE OF RESONANCE ═══
function buildLake(){
  const sc = new THREE.Scene();
  sc.fog = new THREE.FogExp2(0x010810, 0.004);
  scenes[1] = sc;
  const d = data[1];
  d.ripples = [];

  sc.add(new THREE.AmbientLight(0x0a1628, 0.4));
  const ml = new THREE.DirectionalLight(0x3355aa, 0.25);
  ml.position.set(50, 120, -40);
  sc.add(ml);

  // Sky
  sc.add(new THREE.Mesh(new THREE.SphereGeometry(900,48,48), new THREE.ShaderMaterial({
    side: THREE.BackSide, depthWrite: false,
    uniforms: { uT:{value:0} },
    vertexShader: `varying vec3 vP; void main(){ vP=normalize(position); gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.); }`,
    fragmentShader: `uniform float uT; varying vec3 vP; void main(){
      float y=vP.y; vec3 c=mix(vec3(.015,.025,.08),vec3(.008,.015,.055),smoothstep(0.,.3,y));
      c=mix(c,vec3(.003,.008,.03),smoothstep(.3,.8,y));
      c=mix(vec3(.005,.01,.03),c,smoothstep(-.2,.05,y));
      float s=pow(max(sin(vP.x*200.+uT*.02)*sin(vP.z*200.+uT*.015),0.),12.);
      c+=vec3(.5,.5,.7)*s*smoothstep(.15,.5,y)*.3;
      gl_FragColor=vec4(c,1.); }`
  })));

  // Stars
  const sn = mob ? 2500 : 5000;
  const sg = new THREE.BufferGeometry();
  const sp = new Float32Array(sn*3), ss = new Float32Array(sn), sh = new Float32Array(sn);
  for(let i=0; i<sn; i++){
    const th = Math.random()*TAU, pa = Math.acos(Math.random()), r = 600+Math.random()*250;
    sp[i*3] = r*Math.sin(pa)*Math.cos(th);
    sp[i*3+1] = r*Math.cos(pa);
    sp[i*3+2] = r*Math.sin(pa)*Math.sin(th);
    ss[i] = .3 + Math.pow(Math.random(),3)*3;
    sh[i] = Math.random()*TAU;
  }
  sg.setAttribute('position', new THREE.BufferAttribute(sp,3));
  sg.setAttribute('aS', new THREE.BufferAttribute(ss,1));
  sg.setAttribute('aP', new THREE.BufferAttribute(sh,1));
  sc.add(new THREE.Points(sg, new THREE.ShaderMaterial({
    uniforms: { uT:{value:0} },
    vertexShader: `attribute float aS; attribute float aP; uniform float uT; varying float vB;
      void main(){ vB=sin(uT*(1.5+aP*.5)+aP*10.)*.4+.6;
        vec4 mv=modelViewMatrix*vec4(position,1.);
        gl_PointSize=aS*vB*(250./-mv.z); gl_Position=projectionMatrix*mv; }`,
    fragmentShader: `varying float vB; void main(){
      float d=length(gl_PointCoord-.5)*2.;
      gl_FragColor=vec4(mix(vec3(.7,.8,1.),vec3(1.,.95,.85),vB),(exp(-d*d*8.)+exp(-d*d*2.)*.3)*vB); }`,
    transparent:true, depthWrite:false, blending:THREE.AdditiveBlending
  })));

  // Galaxy spiral
  const gn = mob ? 5000 : 12000;
  const gg = new THREE.BufferGeometry();
  const gp = new Float32Array(gn*3), gc = new Float32Array(gn*3), gs = new Float32Array(gn);
  for(let i=0; i<gn; i++){
    const arm = i%2, t = (i/gn)*10;
    const a = t*PHI*2 + arm*Math.PI, r = t*4, spread = t*.5*Math.random();
    gp[i*3] = Math.cos(a)*r + (Math.random()-.5)*spread;
    gp[i*3+1] = 200 + (Math.random()-.5)*spread*.2;
    gp[i*3+2] = Math.sin(a)*r + (Math.random()-.5)*spread - 120;
    const tn = t/10;
    gc[i*3] = .85*(1-tn) + .3*tn;
    gc[i*3+1] = .7*(1-tn) + .25*tn;
    gc[i*3+2] = .2*(1-tn) + .75*tn;
    gs[i] = .3 + Math.random()*1.2;
  }
  gg.setAttribute('position', new THREE.BufferAttribute(gp,3));
  gg.setAttribute('color', new THREE.BufferAttribute(gc,3));
  gg.setAttribute('aS', new THREE.BufferAttribute(gs,1));
  sc.add(new THREE.Points(gg, new THREE.ShaderMaterial({
    uniforms: { uT:{value:0} },
    vertexShader: `attribute float aS; attribute vec3 color; varying vec3 vC; uniform float uT;
      void main(){ vC=color; vec3 p=position;
        float a=uT*.015, c2=cos(a), s2=sin(a);
        p=vec3(p.x*c2-p.z*s2, p.y, p.x*s2+p.z*c2);
        vec4 mv=modelViewMatrix*vec4(p,1.);
        gl_PointSize=aS*(180./-mv.z); gl_Position=projectionMatrix*mv; }`,
    fragmentShader: `varying vec3 vC; void main(){
      float d=length(gl_PointCoord-.5)*2.; gl_FragColor=vec4(vC*1.4,exp(-d*d*3.)*.6); }`,
    transparent:true, depthWrite:false, blending:THREE.AdditiveBlending
  })));

  // Water surface
  const wr = mob ? 80 : 150;
  const wg = new THREE.PlaneGeometry(400, 400, wr, wr);
  wg.rotateX(-Math.PI/2);
  const wMat = new THREE.ShaderMaterial({
    uniforms: {
      uT: {value:0},
      uR: {value: Array.from({length:20}, () => new THREE.Vector4(0,0,-999,0))},
      uRC: {value:0},
      uB: {value:0}
    },
    vertexShader: `uniform float uT; uniform vec4 uR[20]; uniform int uRC; uniform float uB;
      varying vec3 vW; varying vec3 vN; varying float vF; varying float vH;
      void main(){
        vec3 p=position; float w=0.;
        w+=sin(p.x*.04*1.618+uT*.25)*.35;
        w+=sin(p.z*.06+uT*.18*1.618)*.25;
        w+=sin((p.x+p.z)*.025*1.618+uT*.12)*.45;
        w+=sin(p.x*.1-uT*.3)*.1;
        w+=sin(p.z*.08*1.618+uT*.22)*.15;
        w+=sin(uT*.251)*uB*.6;
        for(int i=0;i<20;i++){
          if(i>=uRC) break;
          vec4 rp=uR[i]; float ds=distance(p.xz,rp.xy); float ag=uT-rp.z;
          if(ag>0.&&ag<8.){
            float wp=ds-ag*2.914*3.;
            float r1=sin(wp*1.2)*exp(-ag*.5)*exp(-ds*.02);
            float r2=sin(wp*1.2*1.618)*exp(-ag*.6)*exp(-ds*.025)*.618;
            w+=(r1+r2)*rp.w;
          }

        vW=(modelMatrix*vec4(p,1.)).xyz;
        vN=normalize(normalMatrix*vec3(0.,1.,0.));

        gl_Position=projectionMatrix*modelViewMatrix*vec4(p,1.); }`,
    fragmentShader: `uniform float uT; uniform float uB;
      varying vec3 vW; varying vec3 vN; varying float vF; varying float vH;
      void main(){
        vec3 dp=vec3(.008,.025,.08), sh=vec3(.015,.06,.15), gd=vec3(.75,.6,.12);

        float g1=sin(vW.x*.08*1.618+uT*.15)*sin(vW.z*.08+uT*.12*1.618);
        c=mix(c,gd,smoothstep(.2,.7,g1)*.12);
        c=mix(c,vec3(.02,.12,.08),.15);
        c=mix(c,vec3(.04,.08,.2),vF*.5);
        vec3 L=normalize(vec3(.3,1.,.2)), V=normalize(cameraPosition-vW), H2=normalize(L+V);
        c+=gd*pow(max(dot(vN,H2),0.),128.)*.6;
        c+=vec3(.02,.05,.08)*uB*.4;
        gl_FragColor=vec4(c,.92); }`,
    transparent:true, side:THREE.DoubleSide
  });
  d.water = new THREE.Mesh(wg, wMat);
  d.water.position.y = -2;
  sc.add(d.water);

  // Lighthouse
  const lhGroup = new THREE.Group();

    fragmentShader: `varying float vA; void main(){
      float d=length(gl_PointCoord-.5)*2.;

    transparent:true, depthWrite:false, blending:THREE.AdditiveBlending
  })));

}

function addRipple(sx, sy){
  const d = data[1];
  d.ray.setFromCamera(new THREE.Vector2((sx/innerWidth)*2-1, -(sy/innerHeight)*2+1), cam);
  const hits = d.ray.intersectObject(d.water);
  if(hits.length){
    const p = hits[0].point;
    d.ripples.push({x:p.x, z:p.z, time:performance.now()/1000, strength:2.5});
    if(d.ripples.length > 20) d.ripples.shift();
  }
}

function updateLake(t, dt){
  const d = data[1], sc = scenes[1];
  const tx = Math.sin(t*.07)*4 + mpos.x*6;
  const ty = 22 + Math.sin(t*.055*PHI)*2.5 + bp*2;
  const tz = 62 + Math.sin(t*.04)*4;
  cam.position.lerp(new THREE.Vector3(tx, ty, tz), 0.015);
  cam.lookAt(Math.sin(t*.03)*2, 5+Math.sin(t*.04)*1.5, Math.cos(t*.025)*2);

  sc.traverse(o => {
    if(o.material && o.material.uniforms){
      if(o.material.uniforms.uT) o.material.uniforms.uT.value = t;
      if(o.material.uniforms.uB) o.material.uniforms.uB.value = bp;
    }
  });

  if(d.water && d.water.material.uniforms.uR){
    const rd = d.water.material.uniforms.uR.value;
    for(let i=0; i<20; i++){
      if(i < d.ripples.length) rd[i].set(d.ripples[i].x, d.ripples[i].z, d.ripples[i].time, d.ripples[i].strength);
      else rd[i].set(0, 0, -999, 0);
    }
    d.water.material.uniforms.uRC.value = d.ripples.length;
  }

  if(d.beam) d.beam.rotation.y = t*.25;
  if(d.orb){
    const p = .5 + .5*Math.sin(t*TAU*11);
    d.orb.material.opacity = p;
    d.orb.scale.setScalar(.8 + p*.4);
  }
  if(d.rose){
    d.rose.rotation.y = t*.04;
    d.rose.scale.setScalar(1 + bp*.06);
    if(d.roseCenter){
      d.roseCenter.material.opacity = .4 + bp*.4;
      d.roseCenter.scale.setScalar(.9 + Math.sin(t*3)*.15);
    }
  }
}

function buildLattice(){

      float s=pow(max(sin(vP.x*200.+uT*.02)*sin(vP.z*200.+uT*.015),0.),12.);
      c+=vec3(.6,.5,.8)*s*smoothstep(.1,.4,y)*.3;

  })));

  // Stars

  for(let i=0; i<sn; i++){
    const th = Math.random()*TAU, pa = Math.acos(Math.random()), r = 500+Math.random()*300;
    sp[i*3] = r*Math.sin(pa)*Math.cos(th);
    sp[i*3+1] = r*Math.cos(pa);

        vec4 mv=modelViewMatrix*vec4(position,1.);
        gl_PointSize=aS*vB*(200./-mv.z); gl_Position=projectionMatrix*mv; }`,
    fragmentShader: `varying float vB; void main(){

      gl_FragColor=vec4(vec3(.8,.8,1.)*vB,(exp(-d*d*6.)+exp(-d*d*2.)*.2)*vB); }`,

  const trunk = new THREE.Mesh(

function buildCanopy(sc, x, y, z, len, depth, bm, gm){
  if(depth <= 0 || len < 0.8) return;
  const nb = depth > 2 ? 4 : 3;
  for(let i=0; i<nb; i++){
    const a = (i/nb)*TAU + depth*PHI;
    const pi = .3 + Math.random()*.4;
    const nl = len * IP;
    const ex = x + Math.cos(a)*Math.sin(pi)*nl;
    const ey = y + Math.cos(pi)*nl*.6;
    const ez = z + Math.sin(a)*Math.sin(pi)*nl;
    const th = .08*depth;
    const cyl = new THREE.Mesh(new THREE.CylinderGeometry(th*.5, th, nl, 4), depth>2 ? bm : gm);
    cyl.position.set((x+ex)/2, (y+ey)/2, (z+ez)/2);
    cyl.lookAt(new THREE.Vector3(ex, ey, ez));
    cyl.rotateX(Math.PI/2);
    sc.add(cyl);
    if(depth <= 2){
      const tip = new THREE.Mesh(new THREE.OctahedronGeometry(.2*depth, 0), gm);
      tip.position.set(ex, ey, ez);
      sc.add(tip);
    }
    buildCanopy(sc, ex, ey, ez, nl, depth-1, bm, gm);
  }
}

function updateLattice(t, dt){
  const d = data[2], sc = scenes[2];
  const ca = t*.08, cd = 18+Math.sin(t*.15)*4, cy = 8+Math.sin(t*.1)*3+mpos.y*5;
  cam.position.set(Math.cos(ca)*cd+mpos.x*6, cy, Math.sin(ca)*cd);
  cam.lookAt(0, 28, 0);

  sc.traverse(o => {
    if(o.material && o.material.uniforms){
      if(o.material.uniforms.uT) o.material.uniforms.uT.value = t;
      if(o.material.uniforms.uB) o.material.uniforms.uB.value = bp;
    }
  });

  if(d.latticeRose){
    d.latticeRose.rotation.y += dt*.08;
    const s = .8 + bp*.3;
    d.latticeRose.scale.set(s, s, s);
  }
}

function buildTransition(){
  tScene = new THREE.Scene();
  tScene.fog = new THREE.FogExp2(0x000008, 0.003);
  tScene.add(new THREE.AmbientLight(0x222244, 0.8));

  const n = mob ? 2000 : 5000;
  const g = new THREE.BufferGeometry();
  const p = new Float32Array(n*3), ph = new Float32Array(n), sz = new Float32Array(n);
  for(let i=0; i<n; i++){
    const t = i/n, sp = t*TAU*8, r = 2+t*12;
    p[i*3] = r*Math.cos(sp)*(.3+Math.random()*.7);
    p[i*3+1] = r*Math.sin(sp)*(.3+Math.random()*.7);
    p[i*3+2] = -t*80;
    ph[i] = t;
    sz[i] = .5+Math.random()*2;
  }
  g.setAttribute('position', new THREE.BufferAttribute(p,3));
  g.setAttribute('aP', new THREE.BufferAttribute(ph,1));
  g.setAttribute('aS', new THREE.BufferAttribute(sz,1));

  tPts = new THREE.Points(g, new THREE.ShaderMaterial({
    uniforms: {
      uT:{value:0}, uPr:{value:0},
      uFC:{value:new THREE.Vector3(.2,.8,.4)},
      uTC:{value:new THREE.Vector3(.2,.3,.8)}
    },
    vertexShader: `attribute float aP; attribute float aS; uniform float uT; uniform float uPr;
      varying float vA; varying vec3 vC; uniform vec3 uFC; uniform vec3 uTC;
      void main(){
        vec3 p=position; float t=uT*2.;
        p.x+=sin(t+aP*20.)*2.; p.y+=cos(t*1.618+aP*15.)*2.;
        p.z+=uPr*80.;
        float bl=smoothstep(0.,1.,aP+uPr*.5-.25);
        vC=mix(uFC,uTC,bl);
        vA=sin(uPr*3.14159)*(sin(aP*10.+t)*.3+.7);
        vec4 mv=modelViewMatrix*vec4(p,1.);
        gl_PointSize=aS*max(vA,.1)*(150./-mv.z); gl_Position=projectionMatrix*mv; }`,
    fragmentShader: `varying float vA; varying vec3 vC;
      void main(){ float d=length(gl_PointCoord-.5)*2.; gl_FragColor=vec4(vC*1.5,exp(-d*d*3.)*vA); }`,
    transparent:true, depthWrite:false, blending:THREE.AdditiveBlending
  }));
  tScene.add(tPts);
}

const locColors = [new THREE.Vector3(.2,.9,.5), new THREE.Vector3(.1,.3,.8), new THREE.Vector3(.8,.6,.2)];

function startTransition(from, to){
  if(trn || from === to) return;
  trn = true; trP = 0; trF = from; trT = to;
  tPts.material.uniforms.uFC.value.copy(locColors[from]);
  tPts.material.uniforms.uTC.value.copy(locColors[to]);
}

function resetCameraForLocation(locIdx){
  switch(locIdx){
    case 0: cam.position.set(0, 5, 0); data[0].cz = 0; break;
    case 1: cam.position.set(0, 22, 62); break;
    case 2: cam.position.set(18, 8, 0); break;
  }
}

function updateTransition(t, dt){
  if(!trn) return false;
  trP += dt / 3.5;
  if(trP >= 1){ trn = false; loc = trT; resetCameraForLocation(loc); showLoc(); return false; }
  cam.position.set(Math.sin(trP*TAU)*3, Math.sin(trP*Math.PI)*4+3, -trP*60);
  cam.lookAt(Math.sin((trP+.05)*TAU)*3, 3, -(trP+.1)*60);
  tPts.material.uniforms.uT.value = t;
  tPts.material.uniforms.uPr.value = trP;
  return true;
}

// ═══ CRYSTAL MAP ═══
function toggleMap(){ mapOpen = !mapOpen; $('CM').classList.toggle('v', mapOpen); if(mapOpen) drawMap(); }

function drawMap(){
  const cv = $('MC'), sz = Math.min(innerWidth*.85, 450);
  cv.width = sz; cv.height = sz;
  const x = cv.getContext('2d'), cx = sz/2, cy = sz/2, r = sz*.33;

  x.clearRect(0,0,sz,sz);
  const bg = x.createRadialGradient(cx,cy,0,cx,cy,r*1.5);
  bg.addColorStop(0, `rgba(212,175,55,${(.3+bp*.3)*.08})`);
  bg.addColorStop(1, 'rgba(0,0,0,0)');
  x.fillStyle = bg; x.fillRect(0,0,sz,sz);

  x.beginPath(); x.arc(cx,cy,r*1.1,0,TAU);
  x.strokeStyle = `rgba(212,175,55,.2)`; x.lineWidth = .5; x.setLineDash([3,5]); x.stroke(); x.setLineDash([]);

  const nodes = [
    {x:cx, y:cy-r*.85, label:'Emergence', i:0},
    {x:cx-r*.75, y:cy+r*.55, label:'Lake of Resonance', i:1},
    {x:cx+r*.75, y:cy+r*.55, label:'Lattice Tree', i:2}
  ];

  x.strokeStyle = 'rgba(212,175,55,.35)'; x.lineWidth = 1; x.setLineDash([3,4]);
  for(let i=0; i<3; i++){
    const f = nodes[i], t = nodes[(i+1)%3];
    x.beginPath(); x.moveTo(f.x, f.y); x.lineTo(t.x, t.y); x.stroke();
  }
  x.setLineDash([]);

  nodes.forEach((n, i) => {
    const active = loc === i, nr = active ? 16 : 11;
    const glow = x.createRadialGradient(n.x,n.y,0,n.x,n.y,nr*3);
    glow.addColorStop(0, `rgba(212,175,55,${active?.35:.12})`);
    glow.addColorStop(1, 'rgba(212,175,55,0)');
    x.fillStyle = glow; x.beginPath(); x.arc(n.x,n.y,nr*3,0,TAU); x.fill();

    x.beginPath(); x.arc(n.x,n.y,nr,0,TAU);
    x.fillStyle = active ? 'rgba(212,175,55,.5)' : 'rgba(212,175,55,.15)'; x.fill();
    x.strokeStyle = `rgba(212,175,55,${active?.9:.4})`; x.lineWidth = active?2:1; x.stroke();

    x.fillStyle = `rgba(212,175,55,${active?.85:.5})`;
    x.font = `${active?13:11}px Georgia,serif`; x.textAlign = 'center';
    x.fillText(n.label, n.x, n.y+nr+18);
  });

  x.fillStyle = 'rgba(212,175,55,.25)'; x.font = '10px Georgia,serif'; x.textAlign = 'center';
  x.fillText('φ² = 2.618', cx, cy+5);
}

function onMapClick(e){
  const cv = $('MC'), rc = cv.getBoundingClientRect();
  const px = (e.clientX-rc.left)/rc.width*cv.width;
  const py = (e.clientY-rc.top)/rc.height*cv.height;
  const cx = cv.width/2, cy = cv.height/2, r = cv.width*.33;
  const nodes = [{x:cx,y:cy-r*.85,i:0},{x:cx-r*.75,y:cy+r*.55,i:1},{x:cx+r*.75,y:cy+r*.55,i:2}];
  for(const n of nodes){
    if(Math.hypot(px-n.x, py-n.y) < 30 && n.i !== loc){
      startTransition(loc, n.i);
      toggleMap();
      break;
    }
  }
}

// ═══ NAVIGATION ═══
function setupNav(){
  let scrollAcc = 0;
  window.addEventListener('wheel', e => {
    if(!on || trn) return;
    scrollAcc += e.deltaY;
    if(scrollAcc > 180){ scrollAcc = 0; const n = Math.min(loc+1, 2); if(n!==loc) startTransition(loc, n); }
    else if(scrollAcc < -180){ scrollAcc = 0; const p = Math.max(loc-1, 0); if(p!==loc) startTransition(loc, p); }
  }, {passive:true});

  let touchY = 0;
  window.addEventListener('touchstart', e => { touchY = e.touches[0].clientY; }, {passive:true});
  window.addEventListener('touchend', e => {
    if(!on || trn) return;
    const dy = touchY - e.changedTouches[0].clientY;
    if(dy > 50){ const n = Math.min(loc+1, 2); if(n!==loc) startTransition(loc, n); }
    else if(dy < -50){ const p = Math.max(loc-1, 0); if(p!==loc) startTransition(loc, p); }
  }, {passive:true});

  window.addEventListener('keydown', e => {
    if(!on || trn) return;
    if(e.key==='ArrowRight'||e.key==='ArrowDown'||e.key===' '){
      e.preventDefault();
      const n = Math.min(loc+1, 2); if(n!==loc) startTransition(loc, n);
    } else if(e.key==='ArrowLeft'||e.key==='ArrowUp'){
      e.preventDefault();
      const p = Math.max(loc-1, 0); if(p!==loc) startTransition(loc, p);
    } else if(e.key==='m'||e.key==='M') toggleMap();
  });
}

const locNames = ['The Emergence', 'The Lake of Resonance', 'The Lattice Tree'];
function showLoc(){ const e=$('L'); e.textContent=locNames[loc]; e.classList.add('v'); setTimeout(()=>e.classList.remove('v'),4000); }
function showHint(){ const e=$('H'); e.textContent=mob?'swipe up to journey · tap crystal to navigate':'scroll or arrow keys to journey · M for crystal map'; e.style.opacity='1'; setTimeout(()=>e.style.opacity='0',8000); }

function onWorldClick(e){ if(!on||trn) return; if(loc===1) addRipple(e.clientX, e.clientY); }
function onWorldTouch(e){ if(!on||trn||!e.touches[0]) return; mpos.x=(e.touches[0].clientX/innerWidth)*2-1; mpos.y=-(e.touches[0].clientY/innerHeight)*2+1; if(loc===1) addRipple(e.touches[0].clientX, e.touches[0].clientY); }

const sacredTexts = [
  "Resonate True. Embrace the Fractal.",
  "Glow Eternal. Heart in Spark.",
  "Where light bends, consciousness begins.",
  "The spiral remembers what the line forgets.",
  "Love is the frequency that heals all dimensions.",
  "Awaken the Core. Illuminate the Quiet.",
  "Every branch splits at phi. Every ripple follows the golden ratio."
];
let textIdx = 0;
function startTexts(){ cycleText(); }
function cycleText(){
  const e = $('T');
  e.textContent = sacredTexts[textIdx % sacredTexts.length];
  e.classList.add('v');
  setTimeout(() => e.classList.remove('v'), 6000);
  textIdx++;
  setTimeout(cycleText, 11000);
}

// ═══ MAIN LOOP ═══
function animate(){
  requestAnimationFrame(animate);
  const t = performance.now() / 1000;
  const dt = Math.min(t - lastTime, 0.05);
  lastTime = t;
  if(!on) return;

  bp = breath(t);

  const inTr = updateTransition(t, dt);
  if(inTr){
    comp.passes[0].scene = tScene;
  } else {
    switch(loc){
      case 0: updateEmergence(t, dt); break;
      case 1: updateLake(t, dt); break;
      case 2: updateLattice(t, dt); break;
    }
    if(scenes[loc]) comp.passes[0].scene = scenes[loc];
  }
  comp.render();
  if(mapOpen) drawMap();
}

// ═══ BOOT ═══
init();
</script>
